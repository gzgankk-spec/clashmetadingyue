; OpenClash / subconverter 精简模板
; 目标：保留少量常用应用分流，并按地区自动测速选最快节点。
; 注意：此文件不包含订阅地址、token、节点密码或任何个人密钥。

[custom]

; 先剔除机场的流量、到期、公告等“说明节点”，避免被当作代理节点测速。
exclude=流量|套餐|到期|剩余|重置|官网|网站|防失联|公告|通知|客服|工单|订阅|Expire|Traffic|Reset|Remaining|Official|Website

; ---------- 规则（越靠前优先级越高） ----------
; 局域网与私有地址直连
ruleset=DIRECT,[]GEOSITE,private
ruleset=DIRECT,[]GEOIP,private,no-resolve

; 常用应用分流
ruleset=🎬 YouTube,[]GEOSITE,youtube
ruleset=🔎 Google,[]GEOSITE,google
ruleset=✈️ Telegram,[]GEOSITE,telegram
ruleset=📷 Instagram,[]GEOSITE,instagram
ruleset=𝕏 X / Twitter,[]GEOSITE,twitter
ruleset=🤖 ChatGPT,[]GEOSITE,openai
ruleset=🧠 AI,[]GEOSITE,category-ai-!cn
ruleset=🎥 Netflix,[]GEOSITE,netflix
ruleset=🏰 Disney+,[]GEOSITE,disney

; 国内站点和国内 IP 直连
ruleset=DIRECT,[]GEOSITE,cn
ruleset=DIRECT,[]GEOIP,CN,no-resolve

; 常见境外站点与剩余流量
ruleset=🌐 默认出口,[]GEOSITE,gfw
ruleset=🌐 默认出口,[]FINAL

; ---------- 应用策略组 ----------
; 每个应用都可单独指定地区；默认先使用“全局自动”。
custom_proxy_group=🎬 YouTube`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=🔎 Google`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=✈️ Telegram`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=📷 Instagram`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=𝕏 X / Twitter`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=🤖 ChatGPT`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=🧠 AI`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=🎥 Netflix`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择
custom_proxy_group=🏰 Disney+`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择

; 未命中上面应用规则的境外流量走这里
custom_proxy_group=🌐 默认出口`select`[]♻️ 全局自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇺🇸 美国自动`[]🧭 手动选择`[]DIRECT

; ---------- 自动测速组 ----------
; url-test 会定期测速；同一地区内自动选择延迟最低的可用节点。
; 300,5,50 = 每 300 秒检测一次、测速超时 5 秒、切换容差 50ms。
custom_proxy_group=🇭🇰 香港自动`url-test`(?i)(🇭🇰|香港|Hong.?Kong|HKG|(^|[^A-Za-z])HK([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇹🇼 台湾自动`url-test`(?i)(🇹🇼|台湾|台灣|Taiwan|Taipei|Hinet|(^|[^A-Za-z])TW([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇯🇵 日本自动`url-test`(?i)(🇯🇵|日本|Japan|Tokyo|Osaka|(^|[^A-Za-z])JP([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇸🇬 新加坡自动`url-test`(?i)(🇸🇬|新加坡|狮城|獅城|Singapore|(^|[^A-Za-z])SG([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🇺🇸 美国自动`url-test`(?i)(🇺🇸|美国|美國|United.?States|Los.?Angeles|San.?Jose|Seattle|New.?York|(^|[^A-Za-z])US(A)?([^A-Za-z]|$))`https://www.gstatic.com/generate_204`300,5,50

; 所有节点的自动测速与手动兜底
custom_proxy_group=♻️ 全局自动`url-test`.*`https://www.gstatic.com/generate_204`300,5,50
custom_proxy_group=🧭 手动选择`select`.*

; ---------- 生成选项 ----------
enable_rule_generator=true
overwrite_original_rules=true
